<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzz1f3mdlscrbUYKb-LHDECVP-W4Gw2qK4Hj7vZJa3X2BFBZfiexK6rC9ZuOhDik36C/exec';

let SHEET_DATA = {
  headers: [],
  rows: [],
  objects: [],
  raw: []
};

document.addEventListener('DOMContentLoaded', function () {
  console.log('Page loaded: auto connecting to Google Sheet...');
  loadDataFromGoogleSheet();
});

function loadDataFromGoogleSheet() {
  showConnectionStatus('กำลังเชื่อมต่อ Google Sheet...', 'loading');

  const callbackName = 'sheetCallback_' + Date.now();

  window[callbackName] = function (result) {
    try {
      console.log('Google Sheet result:', result);

      if (!result || result.status !== 'ok') {
        throw new Error(result && result.message ? result.message : 'โหลดข้อมูลไม่สำเร็จ');
      }

      SHEET_DATA = {
        headers: result.headers || [],
        rows: result.rows || [],
        objects: result.objects || [],
        raw: result.raw || []
      };

      window.SHEET_DATA = SHEET_DATA;
      window.drugData = SHEET_DATA.objects;
      window.pharmaData = SHEET_DATA.objects;

      applySheetDataToDashboard(SHEET_DATA);

      showConnectionStatus('เชื่อมต่อข้อมูลสำเร็จ', 'success');

      setTimeout(function () {
        const box = document.getElementById('connectionStatus');
        if (box) box.style.display = 'none';
      }, 2500);

    } catch (err) {
      console.error('Google Sheet load error:', err);
      showConnectionStatus('เชื่อมต่อข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    } finally {
      delete window[callbackName];

      const oldScript = document.getElementById(callbackName);
      if (oldScript) oldScript.remove();
    }
  };

  const script = document.createElement('script');
  script.id = callbackName;
  script.src = API_URL + '?callback=' + callbackName + '&t=' + Date.now();

  script.onerror = function () {
    showConnectionStatus('เชื่อมต่อข้อมูลไม่สำเร็จ: โหลด API ไม่ได้', 'error');
    delete window[callbackName];
  };

  document.body.appendChild(script);
}

function applySheetDataToDashboard(sheetData) {
  const objects = sheetData.objects || [];
  const rows = sheetData.rows || [];
  const raw = sheetData.raw || [];

  console.log('Apply data to dashboard:', objects);

  /*
    ระบบนี้จะพยายามเรียก function เดิมใน dashboard ให้อัตโนมัติ
    ถ้าไฟล์เดิมมีชื่อ function เหล่านี้ จะทำงานทันที
  */

  if (typeof renderDashboard === 'function') {
    renderDashboard(objects);
    return;
  }

  if (typeof updateDashboard === 'function') {
    updateDashboard(objects);
    return;
  }

  if (typeof renderData === 'function') {
    renderData(objects);
    return;
  }

  if (typeof displayMedicines === 'function') {
    displayMedicines(objects);
    return;
  }

  if (typeof renderTable === 'function') {
    renderTable(objects);
    return;
  }

  if (typeof loadDashboard === 'function') {
    loadDashboard(objects);
    return;
  }

  /*
    ถ้าไม่มี function เดิมให้เรียก
    จะแสดงข้อมูลเป็นตารางสำรองให้อัตโนมัติ
  */
  renderFallbackTable(sheetData);
}

function renderFallbackTable(sheetData) {
  let box = document.getElementById('sheetDataBox');

  if (!box) {
    box = document.createElement('div');
    box.id = 'sheetDataBox';
    box.style.margin = '20px';
    box.style.padding = '16px';
    box.style.background = 'rgba(255,255,255,0.95)';
    box.style.color = '#111827';
    box.style.borderRadius = '14px';
    box.style.boxShadow = '0 10px 25px rgba(0,0,0,0.15)';
    document.body.appendChild(box);
  }

  const headers = sheetData.headers || [];
  const rows = sheetData.rows || [];

  if (headers.length === 0 || rows.length === 0) {
    box.innerHTML = `
      <h3>ข้อมูลจาก Google Sheet</h3>
      <p>ยังไม่มีข้อมูลในชีต drug_daily</p>
    `;
    return;
  }

  let html = `
    <h3 style="margin-bottom:12px;">ข้อมูลจาก Google Sheet</h3>
    <div style="overflow:auto; max-height:500px;">
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr>
  `;

  headers.forEach(function (h) {
    html += `
      <th style="border:1px solid #e5e7eb; padding:8px; background:#f3f4f6; text-align:left;">
        ${escapeHtml(h)}
      </th>
    `;
  });

  html += `
          </tr>
        </thead>
        <tbody>
  `;

  rows.forEach(function (row) {
    html += '<tr>';

    headers.forEach(function (_, i) {
      html += `
        <td style="border:1px solid #e5e7eb; padding:8px;">
          ${escapeHtml(row[i] ?? '')}
        </td>
      `;
    });

    html += '</tr>';
  });

  html += `
        </tbody>
      </table>
    </div>
  `;

  box.innerHTML = html;
}

function showConnectionStatus(message, type) {
  let box = document.getElementById('connectionStatus');

  if (!box) {
    box = document.createElement('div');
    box.id = 'connectionStatus';
    box.style.position = 'fixed';
    box.style.top = '12px';
    box.style.right = '12px';
    box.style.zIndex = '99999';
    box.style.padding = '10px 14px';
    box.style.borderRadius = '10px';
    box.style.fontSize = '14px';
    box.style.fontWeight = '600';
    box.style.boxShadow = '0 4px 12px rgba(0,0,0,0.22)';
    box.style.fontFamily = 'Arial, sans-serif';
    document.body.appendChild(box);
  }

  box.style.display = 'block';
  box.textContent = message;

  if (type === 'success') {
    box.style.background = '#d1fae5';
    box.style.color = '#065f46';
    box.style.border = '1px solid #10b981';
  } else if (type === 'error') {
    box.style.background = '#fee2e2';
    box.style.color = '#991b1b';
    box.style.border = '1px solid #ef4444';
  } else {
    box.style.background = '#e0f2fe';
    box.style.color = '#075985';
    box.style.border = '1px solid #0ea5e9';
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}
</script>
